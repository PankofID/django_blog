{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111a27">
    <meta name="description" content="Личный блог Панкова Даниила о программировании, математике и жизни.">
    <title>{% block title %}PankofID — личный блог{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/css/home.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="#top" aria-label="PankofID — на главную">PankofID</a>
            <button class="menu-toggle icon-button" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="primary-nav">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <nav class="primary-nav" id="primary-nav" aria-label="Основная навигация">
                <a class="nav-link is-active" href="#top">Главная</a>
                <a class="nav-link" href="#about">О&nbsp;мне</a>
                <a class="nav-link" href="#posts">Посты</a>
                <a class="nav-link" href="#contact">Контакты</a>
            </nav>
            <div class="header-actions">
                <button class="icon-button search-toggle" type="button" aria-label="Открыть поиск" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.2 4.2"/></svg>
                </button>
            </div>
        </div>
        <form class="search-panel" role="search" hidden>
            <label class="sr-only" for="site-search">Поиск по постам</label>
            <input id="site-search" type="search" placeholder="Найти пост..." autocomplete="off">
            <button class="search-close" type="button" aria-label="Закрыть поиск">×</button>
        </form>
    </header>

    <main id="top">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" id="contact">
        <div class="footer-inner">
            <div class="footer-brand">
                <a class="brand" href="#top">PankofID</a>
            </div>
            <nav class="footer-nav" aria-label="Навигация в подвале">
                <a href="#top">Главная</a>
                <a href="#about">О&nbsp;мне</a>
                <a href="#posts">Посты</a>
                <a href="#contact">Контакты</a>
            </nav>
            <div class="social-links" aria-label="Социальные сети">
                <a href="#" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6S17.5 1.3 14 3.6a13.2 13.2 0 0 0-7 0C3.5 1.3 2.3 1.6 2.3 1.6a4.8 4.8 0 0 0-.1 3.6A5.2 5.2 0 0 0 .8 8.8c0 5.2 3.1 6.4 6.1 6.7A3.4 3.4 0 0 0 6 18.1V22"/></svg></a>
                <a href="#" aria-label="Telegram" title="Telegram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 3-7 18-4-8-8-4Z"/><path d="M22 3 11 13"/></svg></a>
                <a href="#" aria-label="ВКонтакте" title="ВКонтакте"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c.4 5.1 2.8 7.3 4.7 7.8V7h2.8v4.4c1.9-.2 3.8-2.2 4.5-4.4h2.8a9.3 9.3 0 0 1-4.1 5.6 9.7 9.7 0 0 1 4.7 5.4h-3.1a6.7 6.7 0 0 0-4.8-4.3V18h-.4C8.4 18 4.2 14 4 7Z"/></svg></a>
                <a href="#" aria-label="YouTube" title="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg></a>
            </div>
        </div>
        <div class="footer-bottom">
            <span>© 2025 PankofID. Все права защищены.</span>
        </div>
    </footer>
    <script src="{% static 'main/js/home.js' %}" defer></script>
</body>
</html>
